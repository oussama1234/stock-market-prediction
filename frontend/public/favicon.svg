<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Background gradient -->
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#a855f7;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ec4899;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background circle -->
  <circle cx="50" cy="50" r="48" fill="url(#grad)"/>
  
  <!-- Stock chart line (bullish trend) -->
  <polyline 
    points="15,65 25,60 35,55 45,50 55,45 65,35 75,30 85,25" 
    fill="none" 
    stroke="white" 
    stroke-width="4" 
    stroke-linecap="round" 
    stroke-linejoin="round"
  />
  
  <!-- Candlestick accent -->
  <rect x="30" y="55" width="4" height="8" fill="white" opacity="0.8"/>
  <rect x="50" y="45" width="4" height="8" fill="white" opacity="0.8"/>
  <rect x="70" y="30" width="4" height="8" fill="white" opacity="0.8"/>
  
  <!-- Dollar sign -->
  <text x="50" y="85" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="white" text-anchor="middle">$</text>
</svg>
